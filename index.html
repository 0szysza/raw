<script>
function toggleTheme(){
document.body.classList.toggle("dark");
localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
}

if(localStorage.getItem("theme")==="dark"){
document.body.classList.add("dark");
}

function clearAll(){
document.getElementById("input").value="";
document.getElementById("output").value="";
document.getElementById("status").textContent="";
}

function copyOutput(){
const output=document.getElementById("output");
output.select();
navigator.clipboard.writeText(output.value);
document.getElementById("status").textContent="Copied!";
}

function convert(){
const input=document.getElementById("input").value;
const mode=document.getElementById("mode").value;

if(!input.trim()){
document.getElementById("status").textContent="Nothing to convert.";
return;
}

try{
let result;

if(mode==="upgrades"){
result=convertUpgrades(input);
}else{
result=convertChestLoot(input);
}

document.getElementById("output").value=result;
document.getElementById("status").textContent="Converted successfully.";
}catch(e){
document.getElementById("output").value="";
document.getElementById("status").textContent="Error: "+e.message;
}
}

function getString(text,key){
const regex=new RegExp("\\b"+key+"\\s*=\\s*[\"']([^\"']*)[\"']");
const match=text.match(regex);
return match?match[1]:null;
}

function getNumber(text,key){
const regex=new RegExp("\\b"+key+"\\s*=\\s*(-?\\d+(?:\\.\\d+)?)");
const match=text.match(regex);
return match?match[1]:null;
}

function luaString(value){
return '"' + value.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';
}

function escapeLuaPattern(text){
return text.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function parseTables(text){
const tables=[];
let depth=0;
let start=-1;

for(let i=0;i<text.length;i++){
const c=text[i];

if(c==="{"){
if(depth===0)start=i;
depth++;
}else if(c==="}"){
depth--;
if(depth===0 && start!==-1){
tables.push(text.slice(start,i+1));
start=-1;
}
}
}

return tables;
}

function splitTopLevel(text){
const result=[];
let depth=0;
let quote=null;
let start=0;

for(let i=0;i<text.length;i++){
const c=text[i];

if(quote){
if(c===quote && text[i-1]!=="\\")quote=null;
continue;
}

if(c==="\""||c==="'"){
quote=c;
continue;
}

if(c==="{")depth++;
else if(c==="}")depth--;
else if(c===","&&depth===0){
result.push(text.slice(start,i).trim());
start=i+1;
}
}

const last=text.slice(start).trim();
if(last)result.push(last);

return result;
}

function parseUpgradeObjects(upgradesText){
const objects=[];
const matches=[];
let depth=0;
let start=-1;

for(let i=0;i<upgradesText.length;i++){
const c=upgradesText[i];

if(c==="{"){
if(depth===0)start=i;
depth++;
}else if(c==="}"){
depth--;
if(depth===0&&start!==-1){
matches.push(upgradesText.slice(start,i+1));
start=-1;
}
}
}

for(const obj of matches){
const cost=getNumber(obj,"Cost");
const value=getNumber(obj,"Value");

if(cost!==null&&value!==null){
objects.push({
cost:cost,
value:value
});
}
}

return objects;
}

function parseUpgrades(input){
const results=[];

const regex=/v2\s*=\s*\{([\s\S]*?)\}\s*v3\s*=/g;
let match;

while((match=regex.exec(input))!==null){
const block=match[1];

const name=getString(block,"Name");
const icon=getString(block,"Icon");
const layout=getNumber(block,"LayoutOrder");
const type=getString(block,"Type");
const valueType=getString(block,"ValueType");
const baseValue=getNumber(block,"BaseValue");
const cost=getNumber(block,"Cost");

if(name){
results.push({
name,
icon,
layout,
type,
valueType,
baseValue,
cost,
block
});
}
}

return results;
}

function findUpgradeTables(input){
const results=[];
let pos=0;

while(true){
const start=input.indexOf("v2.Upgrades",pos);
if(start===-1)break;

const equals=input.indexOf("=",start);
if(equals===-1)break;

const brace=input.indexOf("{",equals);
if(brace===-1)break;

let depth=0;
let end=-1;

for(let i=brace;i<input.length;i++){
if(input[i]==="{")depth++;
else if(input[i]==="}"){
depth--;
if(depth===0){
end=i;
break;
}
}
}

if(end!==-1){
results.push(input.slice(brace,end+1));
pos=end+1;
}else{
break;
}
}

return results;
}

function parseUpgradeData(input){

let pos=0;

while(true){
const start=input.indexOf("v2 = {",pos);
if(start===-1)break;

const open=input.indexOf("{",start);
let depth=0;

else if(input[i]==="}"){
depth--;

break;

if(end===-1)break;

const name=getString(block,"Name");
const descriptionBlock=input.slice(end);

definitions.push({
name,
block,
end
});

pos=end+1;
}

return definitions;
}

function extractDescriptions(input){
const descriptions=[];

const regex=/v2\.Description\s*=\s*\(([\s\S]*?)\):format/g;
let match;

while((match=regex.exec(input))!==null){
const raw=match[1].trim();
let description=raw;

const quoted=raw.match(/["']([\s\S]*?)["']/);
if(quoted)description=quoted[1];

description=description.replace(/\\n/g,"<br/>");

descriptions.push(description);
}

return descriptions;
}

function extractBuffs(input){
const buffs=[];
const regex=/RichText\.autoColor\(\s*["']([^"']+)["']/g;
let match;

while((match=regex.exec(input))!==null){
buffs.push(match[1]);
}

return buffs;
}

function extractUpgradeBlocks(input){
const blocks=[];
let pos=0;

while(true){
const v2=input.indexOf("v2 = {",pos);
if(v2===-1)break;

const open=input.indexOf("{",v2);
if(open===-1)break;

let depth=0;
let end=-1;

for(let i=open;i<input.length;i++){
if(input[i]==="{")depth++;
else if(input[i]==="}"){
depth--;
if(depth===0){
end=i;
break;
}
}
}

if(end===-1)break;

const block=input.slice(v2,end+1);

let after=end+1;
while(after<input.length&&/\s/.test(input[after]))after++;

const next=input.slice(after);

blocks.push({
block,
afterText:next
});

pos=end+1;
}

return blocks;
}

function convertUpgrades(input){
const definitions=[];
const descriptions=extractDescriptions(input);

let pos=0;

while(true){

if(start===-1)break;

const open=input.indexOf("{",start);
let depth=0;
let end=-1;

else if(input[i]==="}"){
depth--;
if(depth===0){
end=i;
break;
}
}
}

if(end===-1)break;

const block=input.slice(open,end+1);

if(name){
const after=input.slice(end+1);
const upIndex=after.indexOf("v2.Upgrades");

let cost=getNumber(block,"Cost");

if(upIndex!==-1&&upIndex<150){

if(brace!==-1){

}
}
}

}
}
}

definitions.push({
name,
upgrades,
cost,
descriptionIndex:definitions.length
});
}

pos=end+1;
}

const buffs=extractBuffs(input);

const outputUpgrades=[];

for(let i=0;i<definitions.length;i++){
const item=definitions[i];

let buff=null;

if(item.name==="Extra Currency"){
buff="Autumn Leaves";
}else if(item.name==="Luck"){
buff=null;
}else if(item.name==="Secret Luck"){
buff=null;
}else if(item.name==="Infinity Luck"){
buff=null;
}

if(item.name==="Auto Rebirth"){
outputUpgrades.push(
'            {',
'                name = "Auto Rebirth",',

);

}

'        upgrades = {',
...outputUpgrades,

];

return result.join("\n");
}

function convertChestLoot(input){
const tables=parseTables(input);
const lines=[];

for(const table of tables){
const parts=splitTopLevel(table.slice(1,-1));

for(const part of parts){
const quoted=part.match(/["']([^"']+)["']\s*\*?\s*(?:amount\s*=\s*)?([0-9]+)?/);

if(quoted){
lines.push(part.trim());
}
}

}

if(!lines.length){
return "-- No chest loot entries found";
}

return lines.join("\n");
}
