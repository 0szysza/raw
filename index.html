<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Converter</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f5;color:#18181b;transition:.2s}
body.dark{background:#18181b;color:#f4f4f5}
.container{max-width:1200px;margin:auto;padding:30px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{margin:0;font-size:28px}
.controls{display:flex;gap:10px}
button,select{border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer}
button{background:#18181b;color:white}
body.dark button{background:#f4f4f5;color:#18181b}
select{background:#e4e4e7;color:#18181b}
body.dark select{background:#27272a;color:#f4f4f5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{display:flex;flex-direction:column;gap:10px}
label{font-weight:bold}
textarea{width:100%;height:650px;resize:vertical;border:1px solid #d4d4d8;border-radius:10px;padding:15px;font-family:Consolas,monospace;font-size:13px;background:white;color:#18181b}
body.dark textarea{background:#27272a;color:#f4f4f5;border-color:#3f3f46}
.actions{display:flex;gap:10px}
.status{font-size:13px;opacity:.7}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Lua Converter</h1>
<div class="controls">
<select id="mode">
<option value="chest">Chest Loot</option>
<option value="upgrades">Upgrades</option>
</select>
<button onclick="toggleTheme()">Dark / Light</button>
</div>
</div>

<div class="grid">
<div class="panel">
<label>Input</label>
<textarea id="input" placeholder="Paste Lua code here..."></textarea>
<div class="actions">
<button onclick="convert()">Convert</button>
<button onclick="clearAll()">Clear</button>
</div>
</div>

<div class="panel">
<label>Output</label>
<textarea id="output" readonly></textarea>
<div class="actions">
<button onclick="copyOutput()">Copy</button>
</div>
</div>
</div>

<p class="status" id="status"></p>
</div>

<script>
function toggleTheme(){
    document.body.classList.toggle("dark");
    localStorage.setItem(
        "theme",
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
}

function clearAll(){
    document.getElementById("input").value="";
    document.getElementById("output").value="";
    document.getElementById("status").textContent="";
}

function copyOutput(){
    const output=document.getElementById("output");
    navigator.clipboard.writeText(output.value);
    document.getElementById("status").textContent="Copied!";
}

function convert(){
    const input=document.getElementById("input").value;
    const mode=document.getElementById("mode").value;

    if(!input.trim()){
        document.getElementById("status").textContent="Nothing to convert.";
        return;
    }

    try{
        let result;

        if(mode==="upgrades"){
            result=convertUpgrades(input);
        }else{
            result=convertChestLoot(input);
        }

        document.getElementById("output").value=result;
        document.getElementById("status").textContent="Converted successfully.";
    }catch(error){
        document.getElementById("output").value="";
        document.getElementById("status").textContent="Error: "+error.message;
    }
}

function escapeOutput(text){
    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/"/g,'\\"')
        .replace(/\r?\n/g,"<br/>");
}

function getString(block,key){
    const regex=new RegExp(
        "\\b"+key+"\\s*=\\s*[\"']([^\"']*)[\"']"
    );

    const match=block.match(regex);

    return match ? match[1] : null;
}

function getNumber(block,key){
    const regex=new RegExp(
        "\\b"+key+"\\s*=\\s*(-?\\d+(?:\\.\\d+)?)"
    );

    const match=block.match(regex);

    return match ? match[1] : null;
}

function getBalancedBlock(text,start){
    const open=text.indexOf("{",start);

    if(open===-1){
        return null;
    }

    let depth=0;
    let quote=null;

    for(let i=open;i<text.length;i++){
        const char=text[i];

        if(quote){
            if(char===quote && text[i-1]!=="\\"){
                quote=null;
            }
            continue;
        }

        if(char==="\"" || char==="'"){
            quote=char;
            continue;
        }

        if(char==="{"){
            depth++;
        }else if(char==="}"){
            depth--;

            if(depth===0){
                return {
                    start:open,
                    end:i,
                    text:text.slice(open,i+1)
                };
            }
        }
    }

    return null;
}

function findV2Blocks(input){
    const blocks=[];
    let position=0;

    while(true){
        const start=input.indexOf("v2 = {",position);

        if(start===-1){
            break;
        }

        const block=getBalancedBlock(input,start);

        if(!block){
            break;
        }

        blocks.push({
            start:start,
            end:block.end,
            text:block.text
        });

        position=block.end+1;
    }

    return blocks;
}

function findTableAfter(text,needle){
    const index=text.indexOf(needle);

    if(index===-1){
        return null;
    }

    const equals=text.indexOf("=",index);

    if(equals===-1){
        return null;
    }

    return getBalancedBlock(text,equals);
}

function parseLevels(table){
    const levels=[];

    const regex=/\{\s*Cost\s*=\s*(-?\d+(?:\.\d+)?)\s*,\s*Value\s*=\s*(-?\d+(?:\.\d+)?)\s*\}/g;

    let match;

    while((match=regex.exec(table))!==null){
        levels.push({
            cost:match[1],
            value:match[2]
        });
    }

    return levels;
}

function findDescription(input,fromPosition){
    const rest=input.slice(fromPosition);

    const match=rest.match(
        /v2\.Description\s*=\s*\(\s*["']([\s\S]*?)["']\s*\):format\s*\(\s*v3\s*\)/
    );

    if(!match){
        return null;
    }

    return {
        description:match[1],
        index:fromPosition+match.index
    };
}

function findBuff(input,descriptionIndex){
    const before=input.slice(
        Math.max(0,descriptionIndex-300),
        descriptionIndex
    );

    const matches=[
        ...before.matchAll(
            /RichText\.autoColor\(\s*["']([^"']+)["']\s*,\s*Palette\.Text\.Pink\s*\)/g
        )
    ];

    if(matches.length){
        return matches[matches.length-1][1];
    }

    return null;
}

function replaceDescription(text){
    return text
        .replace(/\\n/g,"<br/>")
        .replace(/%\*/g,"%s");
}

function getCurrencyBuff(description){
    const match=description.match(
        /Increases\s+(.+?)\s+currency\s+by\s+%s/
    );

    if(match){
        return match[1];
    }

    return null;
}

function convertUpgrades(input){
    const blocks=findV2Blocks(input);
    const upgrades=[];

    for(let i=0;i<blocks.length;i++){
        const block=blocks[i];

        const name=getString(block.text,"Name");

        if(!name){
            continue;
        }

        const type=getString(block.text,"Type");
        const cost=getNumber(block.text,"Cost");

        const nextText=input.slice(block.end+1);

        const descriptionInfo=findDescription(
            input,
            block.end+1
        );

        let description="";
        let descriptionIndex=block.end+1;

        if(descriptionInfo){
            description=replaceDescription(
                descriptionInfo.description
            );

            descriptionIndex=descriptionInfo.index;
        }

        if(type==="Single"){
            let menuName=findBuff(
                input,
                descriptionIndex
            );

            if(!menuName){
                const menuMatch=description.match(
                    /Toggled in the (.+?)\./
                );

                if(menuMatch){
                    menuName=menuMatch[1];
                }
            }

            if(menuName){
                description=description.replace(
                    /Toggled in the %s\./,
                    "Toggled in the {{CColor|ffa6f8|"+
                    escapeOutput(menuName)+
                    "|fw=bold}}."
                );
            }

            upgrades.push({
                name:name,
                description:description,
                cost:cost || "0",
                single:true
            });

            continue;
        }

        const upgradesTable=findTableAfter(
            nextText,
            "v2.Upgrades"
        );

        if(!upgradesTable){
            continue;
        }

        const levels=parseLevels(
            upgradesTable.text
        );

        const currencyBuff=getCurrencyBuff(
            description
        );

        upgrades.push({
            name:name,
            description:description,
            buff:currencyBuff,
            levels:levels,
            single:false
        });
    }

    let output="";

    for(let i=0;i<upgrades.length;i++){
        const upgrade=upgrades[i];

        output+="            {\n";
        output+='                name = "'+
            escapeOutput(upgrade.name)+
            '",\n';

        output+='                description = "'+
            escapeOutput(upgrade.description)+
            '",\n';

        if(upgrade.single){
            output+="                cost = "+
                upgrade.cost+
                "\n";
        }else{
            if(upgrade.buff){
                output+='                buff = "'+
                    escapeOutput(upgrade.buff)+
                    '",\n';
            }

            output+='                symbol = "%",\n';
            output+="                levels = {\n";

            for(let j=0;j<upgrade.levels.length;j++){
                const level=upgrade.levels[j];

                output+="                    {\n";
                output+="                        cost = "+
                    level.cost+
                    ",\n";
                output+="                        value = "+
                    level.value+
                    "\n";
                output+="                    }";

                if(j<upgrade.levels.length-1){
                    output+=",";
                }

                output+="\n";
            }

            output+="                }\n";
        }

        output+="            }";

        if(i<upgrades.length-1){
            output+=",";
        }

        output+="\n";
    }

    if(!upgrades.length){
        return "-- No upgrades found";
    }

    return output;
}

function convertChestLoot(input){
    const result=[];
    const lines=input.split(/\r?\n/);

    for(const line of lines){
        const trimmed=line.trim();

        if(
            trimmed.startsWith("{") &&
            (
                trimmed.includes("chance") ||
                trimmed.includes("Chance") ||
                trimmed.includes("amount") ||
                trimmed.includes("Amount")
            )
        ){
            result.push(trimmed);
        }
    }

    if(!result.length){
        return "-- No chest loot entries found";
    }

    return result.join("\n");
}
</script>
</body>
</html>
